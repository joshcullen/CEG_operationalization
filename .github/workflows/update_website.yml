name: Update Website

on:
  workflow_run:
    workflows: ["CMEMS model workflow","ROMS model workflow"]
    types:
      - completed
  workflow_dispatch:

jobs:
  update-website:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      QUARTO_BUILD_DIR: website/docs
    steps:
    - name: Check out repository
      uses: actions/checkout@v4 # Updated to v4 (standard)
      with:
        sparse-checkout: |
          metadata/
          website/
          model_prediction/  # [GULF ADDITION] Need this to get the Gulf TIFFs
        sparse-checkout-cone-mode: true

    - name: Install Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: 3.11

    - name: Install Copernicus Marine Toolbox
      shell: bash -el {0}
      run: |
        conda install -c conda-forge copernicusmarine
        conda install scipy

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: 1.9.9

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.3'

    - name: Install R packages (Standard)
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache-version: 4

    # [GULF ADDITION] Explicitly install packages for the Gulf App & Shinylive
    # We do this separately to ensure 'shinylive' and 'terra' are available on Windows
    - name: Install Gulf App Dependencies
      run: |
        install.packages(c("shinylive", "httpuv", "shiny", "terra", "sf", "ggplot2", "plotly", "rnaturalearth", "rnaturalearthdata", "scales", "patchwork"))
      shell: Rscript {0}

    # [GULF ADDITION] Stage and Build the Gulf App
    # This copies the TIFFs from the model folder -> app folder -> exports to website docs
    - name: Build Gulf Shinylive App
      shell: bash
      run: |
        # 1. Create Staging Directory
        mkdir -p website/gulf_app/predictions
        mkdir -p website/gulf_app/data

        # 2. Copy Daily Predictions
        # Use robust copy (find files first to avoid error if empty)
        cp model_prediction/gulf/predictions/*.tif website/gulf_app/predictions/ || echo "No Gulf predictions found"

        # 3. Copy Static Data
        cp model_prediction/gulf/data/*.gpkg website/gulf_app/data/ || true
        cp model_prediction/gulf/data/*.shp website/gulf_app/data/ || true
        cp model_prediction/gulf/data/*.shx website/gulf_app/data/ || true
        cp model_prediction/gulf/data/*.dbf website/gulf_app/data/ || true
        cp model_prediction/gulf/data/*.prj website/gulf_app/data/ || true

        # 4. Copy the App Code
        # IMPORTANT: You must save the R code I gave you earlier as 'website/gulf_app/app.R'
        # If it doesn't exist yet, create a dummy one or ensure it's committed.
        
        # 5. Export to Website Build Folder
        # This creates 'website/docs/gulf_app_static' containing the WASM bundle
        Rscript -e "shinylive::export('website/gulf_app', 'website/docs/gulf_app_static')"

    - name: Render Quarto Website
      run: quarto render website 
      # Note: This will execute West Coast chunks (live) but ignore the Gulf folder (static)

    - name: Deploy to gh-pages branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ${{ env.QUARTO_BUILD_DIR }}
        publish_branch: gh-pages
